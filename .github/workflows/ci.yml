concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node for data and app-logic tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check vocabulary sources and embedded HTML
        run: |
          python scripts/expand_vocabulary.py --check
          python scripts/build_vocabulary.py --check
          python scripts/generate_vocab_audit_dev5.py --check
          python scripts/validate_vocab.py
          python scripts/embed_vocabulary.py --check
          python scripts/build_phrases.py --check
          python scripts/validate_phrases.py
          python scripts/embed_phrases.py --check
          node scripts/exams/build_answer_keys.mjs --check
          node scripts/exams/audit_rendering.mjs --check
          python scripts/exams/embed_archive.py --check
          python scripts/audit_vocabulary_quality.py --check
          python scripts/vocabulary_evidence_review.py --check
          python scripts/rc4_vocabulary_audit.py --check
          python scripts/audit_exam_provenance.py --check

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      # Node is used only for dependency-free tests; production is a single HTML file.
      - name: Run static app logic, scoring and single-file tests
        run: node --trace-deprecation --test tests/static-app.test.js tests/exam-scoring.test.js

      # rc5/rc8: the ingestion endpoint is the only server-side code in the project,
      # so its contract (origins, size limits, stored fields, status codes, fail-closed salt)
      # is pinned by its own suite rather than by a live request.
      - name: Run telemetry endpoint contract tests
        run: node --trace-deprecation --test tests/telemetry-api.test.js

  # Run both sequential Playwright suites across Chromium, Firefox, and WebKit.
  # Each engine gets its own 2-CPU runner VM so two heavy 16 MB DOM browsers never
  # compete for memory on the same VM, and `playwright-core` remains test-only.
  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node for browser tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the browser test harness (no production dependency)
        run: npm install --no-save --package-lock=false playwright-core@1.55.1 axe-core@4.14.0

      - name: Install ${{ matrix.browser }} for Playwright
        run: npx --yes playwright@1.55.1 install --with-deps ${{ matrix.browser }}

      - name: Point the suites at Playwright's ${{ matrix.browser }}
        run: |
          node -e "process.stdout.write(require('playwright-core')['${{ matrix.browser }}'].executablePath())" > /tmp/browser-path
          echo "BROWSER_ENGINE=${{ matrix.browser }}" >> "$GITHUB_ENV"
          echo "BROWSER_EXECUTABLE=$(cat /tmp/browser-path)" >> "$GITHUB_ENV"
          echo "${{ matrix.browser }}: $(cat /tmp/browser-path)"

      - name: Run both browser suites sequentially (${{ matrix.browser }})
        run: |
          set +e
          bash tests/run-browser-suites.sh 2>&1 | tee /tmp/browser.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 40 /tmp/browser.log | sed 's/^/::error::/'
            exit "$status"
          fi

      - name: Upload browser screenshots on failure (${{ matrix.browser }})
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-screenshots-${{ matrix.browser }}
          path: |
            **/*.png
          if-no-files-found: ignore
          retention-days: 7
