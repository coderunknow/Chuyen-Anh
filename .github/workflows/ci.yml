name: Static checks

on:
  pull_request:
    # Candidate work is reviewed as a draft PR stacked on the previous candidate
    # branch, so a `main`-only filter meant such a PR ran no CI at all (PR #84).
    branches: [main, "arena/**"]
    paths: &ci-paths
      - "index.html"
      - "Learned_Vocabulary_List.md"
      - "Learned_Phrase_List.md"
      - "data/**"
      - "scripts/build_vocabulary.py"
      - "scripts/embed_vocabulary.py"
      - "scripts/learned_vocabulary.py"
      - "scripts/validate_vocab.py"
      - "scripts/build_senses.py"
      - "scripts/cefr_senses.py"
      - "docs/sense-gloss-mappings.json"
      - "scripts/sense_integrity_audit.py"
      - "scripts/audit_sense_sources.py"
      - "audit/v100/evidence/source-locator-review.json"
      - "audit/v100/evidence/sense-integrity-review-queue.json"
      - "scripts/cefr_editorial_map.py"
      - "scripts/migrate_senses.py"
      - "scripts/audit_learned_vocab.py"
      - "scripts/expand_vocabulary.py"
      - "scripts/vocabulary_families.py"
      - "docs/vocabulary-families.json"
      - "scripts/phrase_bank.py"
      - "scripts/build_phrases.py"
      - "scripts/validate_phrases.py"
      - "scripts/embed_phrases.py"
      - "scripts/rc4_vocabulary_audit.py"
      - "docs/vocabulary-sources.json"
      - "scripts/exams/**"
      - "scripts/release_artifacts.py"
      - "scripts/shard_browser_suite.mjs"
      - "scripts/deploy_gate.py"
      - "scripts/app_release_gate.py"
      - "tests/test_app_release_gate.py"
      - "docs/vocabulary-300-*.json"
      - "docs/vocabulary-300-review.md"
      - "docs/vocabulary-audit-dev*.json"
      - "docs/vocabulary-audit-dev*.md"
      - "docs/rc4-vocabulary-audit.*"
      - "docs/EXAM_AUDIT_LEDGER.md"
      - "docs/RC8_*.md"
      - "scripts/generate_vocab_audit_dev*.py"
      - "scripts/vocabulary_curation.py"
      - "scripts/vocabulary_evidence_review.py"
      - "scripts/vocabulary_cefr_review.py"
      - "docs/vocabulary-cefr-review.*"
      - "docs/exam-anomaly-classification.*"
      - "scripts/audit_vocabulary_quality.py"
      - "scripts/audit_exam_provenance.py"
      - "scripts/vocab_sources.py"
      - "docs/vocabulary-curation.json"
      - "docs/vocabulary-quality-audit.*"
      - "docs/vocabulary-evidence-review.*"
      - "docs/exam-provenance-audit.*"
      - "docs/exam-scoring-audit.*"
      - "docs/exam-rendering-audit.*"
      - "scripts/exams/audit_rendering.mjs"
      - "data/exam-answer-keys.json"
      - "docs/exam-crosschecks.json"
      - "tests/run-browser-suites.sh"
      - "README.md"
      - "CHANGELOG.md"
      - "PRIVACY.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "DESIGN_LOG.md"
      - "AGENTS_LOG.md"
      - "De-chuyen-Anh-vao-10/**"
      - "tests/**"
      - "audit/v100/refs/**"
      - "audit/v100/DEFECTS.md"
      - "audit/v100/GATES.md"
      - "audit/v100/FINAL_READINESS.md"
      - "audit/v100/FINAL_READINESS_CHECKLIST.md"
      - "api/**"
      - "app.js"
      - "vercel.json"
      - "supabase/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/release-artifacts.yml"
      - ".github/workflows/release-published-dispatch.yml"
      - ".github/workflows/exam-sources.yml"
      - ".github/workflows/exam-validation.yml"
      - ".github/workflows/pages-smoke.yml"
      - ".github/workflows/telemetry-smoke.yml"
      - "DEPLOY_HOLD"
  push:
    branches: [main]
    # Same list as the pull request trigger, by reference: the two used to be
    # 77 byte-identical lines, so adding a path to one silently left the other
    # stale. YAML anchors must name their target to work - the anchor was
    # declared and then re-typed, which is not an alias.
    paths: *ci-paths
  # Safe manual reruns on an exact ref make the full browser matrix available
  # for repeatable measurement; this workflow only runs checks, never publishes.
  workflow_dispatch:

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node for data and app-logic tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check vocabulary sources and embedded HTML
        run: |
          python scripts/expand_vocabulary.py --check
          python scripts/build_vocabulary.py --check
          python scripts/build_senses.py --check
          python scripts/audit_sense_sources.py --check
          python scripts/sense_integrity_audit.py --check
          python scripts/generate_vocab_audit_dev5.py --check
          python scripts/validate_vocab.py
          python scripts/embed_vocabulary.py --check
          python scripts/build_phrases.py --check
          python scripts/validate_phrases.py
          python scripts/embed_phrases.py --check
          node scripts/exams/build_answer_keys.mjs --check
          node scripts/exams/verify_curated_keys.mjs
          node scripts/exams/audit_rendering.mjs --check
          node scripts/exams/classify_anomalies.mjs --check
          python scripts/exams/embed_archive.py --check
          python scripts/audit_vocabulary_quality.py --check
          python scripts/vocabulary_cefr_review.py --check
          python scripts/vocabulary_evidence_review.py --check
          python scripts/rc4_vocabulary_audit.py --check
          python scripts/audit_exam_provenance.py --check

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      # The archive conversion suite needs the exam pipeline's own dependencies
      # (`scripts/exams/requirements.txt`). Without them two of its five tests
      # error out, which is how the readiness report once claimed `243/243` that
      # no workflow could reproduce. A venv keeps the runner's system Python
      # untouched (PEP 668) and pins the same versions a developer installs.
      - name: Run exam archive conversion tests
        run: |
          python -m venv /tmp/exam-archive-venv
          /tmp/exam-archive-venv/bin/pip install --disable-pip-version-check --quiet -r scripts/exams/requirements.txt
          /tmp/exam-archive-venv/bin/python scripts/exams/test_archive.py

      # Node is used only for dependency-free tests; production is a single HTML file.
      - name: Run static app logic, scoring and single-file tests
        run: node --trace-deprecation --test tests/static-app.test.js tests/exam-scoring.test.js tests/exam-anomalies.test.js tests/rc10-cefr.test.js tests/v100-senses.test.js tests/exam-exempt-rubric.test.js tests/core-invariants.test.js tests/exam-persistence.test.js

      - name: Verify browser shard partition and failure-capture lifecycle
        run: |
          node scripts/shard_browser_suite.mjs --check
          node --test tests/shard-browser-suite.test.mjs tests/fresh-world-failure.test.cjs

      # rc5/rc8: the ingestion endpoint is the only server-side code in the project,
      # so its contract (origins, size limits, stored fields, status codes, fail-closed salt)
      # is pinned by its own suite rather than by a live request.
      - name: Run telemetry endpoint contract tests
        run: node --trace-deprecation --test tests/telemetry-api.test.js

  # Run five disjoint learning-suite regions on each engine. The generator's
  # exact-once partition check runs in `checks`; each matrix job regenerates the
  # ignored shards from the checked-in suite. PART unset still runs the original
  # full learning suite plus exams for local developers. Part 5 runs the complete
  # exam suite once per engine, so no required browser coverage is dropped.
  #
  # Pin ubuntu-24.04 LTS because playwright@1.55.1 registers ubuntu20.04..24.04
  # host platforms (ubuntu-latest migrated to Ubuntu 26.04 in Oct/Nov 2026).
  browser:
    name: browser (${{ matrix.browser }} shard ${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      # Every engine and every source region reports its own verdict: a failure
      # must not hide whether the other engines or regions still pass.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        part: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node for browser tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the browser test harness (no production dependency)
        run: npm install --no-save --package-lock=false playwright-core@1.55.1 axe-core@4.14.0

      - name: Install ${{ matrix.browser }} for Playwright
        run: npx --yes playwright@1.55.1 install --with-deps ${{ matrix.browser }}

      - name: Point the suites at Playwright's ${{ matrix.browser }}
        run: |
          node -e "process.stdout.write(require('playwright-core')['${{ matrix.browser }}'].executablePath())" > /tmp/browser-path
          echo "BROWSER_ENGINE=${{ matrix.browser }}" >> "$GITHUB_ENV"
          echo "BROWSER_EXECUTABLE=$(cat /tmp/browser-path)" >> "$GITHUB_ENV"
          echo "${{ matrix.browser }}: $(cat /tmp/browser-path)"

      # Round 9's (engine, suite) split was measured and reverted because exams
      # were only 11-61 s; the learning suite was the critical path. Here the
      # learning assertions themselves are partitioned at checked scenario
      # boundaries, and the five shards run concurrently on independent runners.
      # Part 5 also runs browser-exams.cjs, once per engine. Measurements and the
      # decision are recorded in ACTIONS_OPTIMIZATION_REPORT.md.
      #
      # Both suites write failure screenshots into a scratch directory that
      # exists only for this job. Upload logs on every outcome and screenshots on
      # failure, with distinct artifact names for each matrix cell.
      - name: Run browser shard (${{ matrix.browser }} part ${{ matrix.part }})
        env:
          PART: ${{ matrix.part }}
          BROWSER_SCREENSHOT_DIR: ${{ runner.temp }}/browser-shots
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/browser-shots"
          bash tests/run-browser-suites.sh 2>&1 | tee /tmp/browser.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 60 /tmp/browser.log | sed 's/^/::error::/'
            exit "$status"
          fi

      - name: Upload browser log (${{ matrix.browser }} part ${{ matrix.part }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-log-${{ matrix.browser }}-part-${{ matrix.part }}
          path: /tmp/browser.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload browser screenshots on failure (${{ matrix.browser }} part ${{ matrix.part }})
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-screenshots-${{ matrix.browser }}-part-${{ matrix.part }}
          path: ${{ runner.temp }}/browser-shots
          if-no-files-found: warn
          retention-days: 7
