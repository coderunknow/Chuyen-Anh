name: Static checks

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "data/**"
      - "scripts/validate_vocab.py"
      - "tests/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "data/**"
      - "scripts/validate_vocab.py"
      - "tests/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate vocabulary
        run: python scripts/validate_vocab.py
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      # Node is used only for dependency-free unit tests; production deployment
      # does not install Node, npm, or a package manager.
      - name: Run static logic tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/static-app.test.js
