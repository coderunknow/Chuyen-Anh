  push:
    branches: [main]
    paths:
      - "index.html"
      - "Learned_Vocabulary_List.md"
      - "Learned_Phrase_List.md"
      - "data/**"
      - "scripts/build_vocabulary.py"
      - "scripts/embed_vocabulary.py"
      - "scripts/learned_vocabulary.py"
      - "scripts/validate_vocab.py"
      - "scripts/audit_learned_vocab.py"
      - "scripts/expand_vocabulary.py"
      - "scripts/phrase_bank.py"
      - "scripts/build_phrases.py"
      - "scripts/validate_phrases.py"
      - "scripts/embed_phrases.py"
      - "docs/vocabulary-sources.json"
      - "scripts/exams/**"
      - "scripts/release_artifacts.py"
