      - "DEPLOY_HOLD"

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node for data and app-logic tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check vocabulary sources and embedded HTML
        run: |
          python scripts/expand_vocabulary.py --check
          python scripts/build_vocabulary.py --check
          python scripts/generate_vocab_audit_dev5.py --check
          python scripts/validate_vocab.py
          python scripts/embed_vocabulary.py --check
          python scripts/build_phrases.py --check
          python scripts/validate_phrases.py
          python scripts/embed_phrases.py --check
          node scripts/exams/build_answer_keys.mjs --check
          node scripts/exams/audit_rendering.mjs --check
          python scripts/exams/embed_archive.py --check
          python scripts/audit_vocabulary_quality.py --check
          python scripts/vocabulary_evidence_review.py --check
          python scripts/audit_exam_provenance.py --check

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      # Node is used only for dependency-free tests; production is a single HTML file.
      - name: Run static app logic, scoring and single-file tests
        run: node --test tests/static-app.test.js tests/exam-scoring.test.js

      # rc5: the ingestion endpoint is the only server-side code in the project,
      # so its contract (origins, size limits, stored fields, status codes) is
      # pinned by its own suite rather than by a live request.
      - name: Run telemetry endpoint contract tests
        run: node --test tests/telemetry-api.test.js

  # The two browser suites were outside CI until rc3. They are sequential on
  # purpose: two Chromium instances at once have crashed on a 2-CPU runner, and a
  # crashed browser is not a test result. `playwright-core` is installed here
  # only — the app stays a single HTML file with no runtime dependency.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the browser test harness (no production dependency)
        run: npm install --no-save --package-lock=false playwright-core@1.55.1 axe-core@4.14.0

      # Use Playwright's own Chromium rather than whatever the runner image
      # happens to ship: the browser is then the exact build this Playwright
      # version was tested against, and the OS libraries come with it.
      - name: Install Chromium for Playwright
        run: npx --yes playwright@1.55.1 install --with-deps chromium

      - name: Point the suites at that Chromium
        run: |
          node -e "process.stdout.write(require('playwright-core').chromium.executablePath())" > /tmp/chrome-path
          echo "BROWSER_EXECUTABLE=$(cat /tmp/chrome-path)" >> "$GITHUB_ENV"
          echo "chromium: $(cat /tmp/chrome-path)"

      - name: Run both browser suites sequentially
        run: |
          set +e
          bash tests/run-browser-suites.sh 2>&1 | tee /tmp/browser.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The job log lives behind a blob URL that is not always reachable;
            # annotations are, so surface the failure where a reader can see it.
            tail -n 40 /tmp/browser.log | sed 's/^/::error::/'
            exit "$status"
          fi

      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: |
            **/*.png
          if-no-files-found: ignore
          retention-days: 7
