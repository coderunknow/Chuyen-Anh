name: Static checks

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "Learned_Vocabulary_List.md"
      - "Learned_Phrase_List.md"
      - "data/**"
      - "scripts/build_vocabulary.py"
      - "scripts/embed_vocabulary.py"
      - "scripts/learned_vocabulary.py"
      - "scripts/validate_vocab.py"
      - "scripts/audit_learned_vocab.py"
      - "scripts/expand_vocabulary.py"
      - "scripts/phrase_bank.py"
      - "scripts/build_phrases.py"
      - "scripts/validate_phrases.py"
      - "scripts/embed_phrases.py"
      - "docs/vocabulary-sources.json"
      - "scripts/exams/**"
      - "scripts/release_artifacts.py"
      - "scripts/deploy_gate.py"
      - "docs/vocabulary-300-*.json"
      - "docs/vocabulary-300-review.md"
      - "docs/vocabulary-audit-dev*.json"
      - "docs/vocabulary-audit-dev*.md"
      - "docs/EXAM_AUDIT_LEDGER.md"
      - "scripts/generate_vocab_audit_dev*.py"
      - "scripts/vocabulary_curation.py"
      - "scripts/vocabulary_evidence_review.py"
      - "scripts/audit_vocabulary_quality.py"
      - "scripts/audit_exam_provenance.py"
      - "scripts/vocab_sources.py"
      - "docs/vocabulary-curation.json"
      - "docs/vocabulary-quality-audit.*"
      - "docs/vocabulary-evidence-review.*"
      - "docs/exam-provenance-audit.*"
      - "docs/exam-crosschecks.json"
      - "tests/run-browser-suites.sh"
      - "README.md"
      - "CHANGELOG.md"
      - "DESIGN_LOG.md"
      - "AGENTS_LOG.md"
      - "De-chuyen-Anh-vao-10/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/release-artifacts.yml"
      - ".github/workflows/release-published-dispatch.yml"
      - "DEPLOY_HOLD"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "Learned_Vocabulary_List.md"
      - "Learned_Phrase_List.md"
      - "data/**"
      - "scripts/build_vocabulary.py"
      - "scripts/embed_vocabulary.py"
      - "scripts/learned_vocabulary.py"
      - "scripts/validate_vocab.py"
      - "scripts/audit_learned_vocab.py"
      - "scripts/expand_vocabulary.py"
      - "scripts/phrase_bank.py"
      - "scripts/build_phrases.py"
      - "scripts/validate_phrases.py"
      - "scripts/embed_phrases.py"
      - "docs/vocabulary-sources.json"
      - "scripts/exams/**"
      - "scripts/release_artifacts.py"
      - "scripts/deploy_gate.py"
      - "docs/vocabulary-300-*.json"
      - "docs/vocabulary-300-review.md"
      - "docs/vocabulary-audit-dev*.json"
      - "docs/vocabulary-audit-dev*.md"
      - "docs/EXAM_AUDIT_LEDGER.md"
      - "scripts/generate_vocab_audit_dev*.py"
      - "scripts/vocabulary_curation.py"
      - "scripts/vocabulary_evidence_review.py"
      - "scripts/audit_vocabulary_quality.py"
      - "scripts/audit_exam_provenance.py"
      - "scripts/vocab_sources.py"
      - "docs/vocabulary-curation.json"
      - "docs/vocabulary-quality-audit.*"
      - "docs/vocabulary-evidence-review.*"
      - "docs/exam-provenance-audit.*"
      - "docs/exam-crosschecks.json"
      - "tests/run-browser-suites.sh"
      - "README.md"
      - "CHANGELOG.md"
      - "DESIGN_LOG.md"
      - "AGENTS_LOG.md"
      - "De-chuyen-Anh-vao-10/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/release-artifacts.yml"
      - ".github/workflows/release-published-dispatch.yml"
      - "DEPLOY_HOLD"

concurrency:
  group: static-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check vocabulary sources and embedded HTML
        run: |
          python scripts/expand_vocabulary.py --check
          python scripts/build_vocabulary.py --check
          python scripts/generate_vocab_audit_dev5.py --check
          python scripts/validate_vocab.py
          python scripts/embed_vocabulary.py --check
          python scripts/build_phrases.py --check
          python scripts/validate_phrases.py
          python scripts/embed_phrases.py --check
          python scripts/exams/embed_archive.py --check
          python scripts/audit_vocabulary_quality.py --check
          python scripts/vocabulary_evidence_review.py --check
          python scripts/audit_exam_provenance.py --check

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      # Node is used only for dependency-free tests; production is a single HTML file.
      - name: Set up Node for app-logic tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static app logic and single-file tests
        run: node --test tests/static-app.test.js

  # The two browser suites were outside CI until rc3. They are sequential on
  # purpose: two Chromium instances at once have crashed on a 2-CPU runner, and a
  # crashed browser is not a test result. `playwright-core` is installed here
  # only — the app stays a single HTML file with no runtime dependency.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the browser test harness (no production dependency)
        run: npm install --no-save --package-lock=false playwright-core@1.55.1 axe-core@4.14.0 @sparticuz/chromium@133.0.0

      - name: Resolve a Chromium executable
        run: |
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if path="$(command -v "$candidate" 2>/dev/null)"; then
              echo "BROWSER_EXECUTABLE=$path" >> "$GITHUB_ENV"
              echo "using $path"
              exit 0
            fi
          done
          echo "no system Chrome found; the suites will use the bundled @sparticuz/chromium"

      - name: Run both browser suites sequentially
        run: bash tests/run-browser-suites.sh

      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: |
            **/*.png
          if-no-files-found: ignore
          retention-days: 7
