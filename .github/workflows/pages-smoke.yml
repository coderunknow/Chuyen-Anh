name: Pages content smoke test

# `deploy_gate.py` decides whether Pages may deploy; this decides whether what
# Pages serves is the build we think it is. It runs from a GitHub runner because
# the development sandbox cannot resolve github.io.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag whose Pages deployment status should be awaited (read-only dry run)"
        required: false
        type: string
  # No push trigger: a push starts this probe before Deploy Flashcard has replaced
  # the live page, so it checked the previous build (run 43677677477). The release
  # and dispatch triggers below wait for the deployment of the released commit.
  # The pull request that changes the probe is the moment to run it: if the
  # assertions do not hold for the page that is live now, that is the finding.
  pull_request:
    paths:
      - "tests/pages_smoke.py"
      - "tests/test_pages_smoke.py"
      - "DEPLOY_HOLD"
      - ".github/workflows/pages-smoke.yml"
  # A published prerelease is what releases the hold, so it is also the moment
  # the served page should change.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # The deployment wait below may take up to 30 s + 60 x 10 s; the job limit must exceed it.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Give a released Pages deployment a moment to propagate
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: sleep 30

      # A release event is emitted before the dispatched Pages deployment has
      # necessarily replaced the previous bytes. Sleep alone was a race: the
      # rc6 release probe read rc5 and failed although the deploy then succeeded.
      # Wait for a successful deployment status carrying the Pages environment
      # URL for the released commit; a failed deployment fails this job.
      - name: Wait for the Pages deployment of a released commit
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+[0-9]+)?$ ]]; then
            echo "::error::Refusing to wait for an invalid release tag: $tag"
            exit 1
          fi
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
          echo "released commit: $sha" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 60); do
            deployment="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${sha}&per_page=1" --jq '.[0].id // empty' 2>/dev/null || true)"
            if [ -n "$deployment" ]; then
              record="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment}/statuses" --jq '.[0] | [(.state // ""), (.environment_url // "")] | @tsv' 2>/dev/null || true)"
              state="${record%%$'\t'*}"
              url="${record#*$'\t'}"
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "deployed: $url" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::error::Pages deployment ${deployment} failed"
                exit 1
              fi
            fi
            echo "waiting for Pages deployment of ${sha} (attempt ${attempt}/60)"
            sleep 10
          done
          echo "::error::Timed out waiting for the Pages deployment of ${sha}"
          exit 1

      - name: Determine the version that should be served
        id: expected
        run: |
          # The served page is the build main declares. The newest published
          # release is not a reliable reference: a stable v1.0.0 published after
          # the v1.0.0-rc11 prerelease would be picked while Pages serves rc11.
          expected="$(python3 -c "from scripts.app_release_gate import app_version; from pathlib import Path; print(app_version(Path('index.html')) or '')")"
          if [ -z "$expected" ]; then
            echo "::error::index.html does not declare exactly one valid APP_VERSION"
            exit 1
          fi
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "Probing $expected (APP_VERSION declared in index.html)" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe the published application
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.expected }}
        run: python tests/pages_smoke.py
