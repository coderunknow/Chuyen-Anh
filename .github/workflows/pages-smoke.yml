name: Pages content smoke test

# `deploy_gate.py` decides whether Pages may deploy; this decides whether what
# Pages serves is the build we think it is. It runs from a GitHub runner because
# the development sandbox cannot resolve github.io.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &pages-paths
      - "tests/pages_smoke.py"
      - "tests/test_pages_smoke.py"
      - "DEPLOY_HOLD"
      - ".github/workflows/pages-smoke.yml"
  # The pull request that changes the probe is the moment to run it: if the
  # assertions do not hold for the page that is live now, that is the finding.
  pull_request:
    paths: *pages-paths
  # A published prerelease is what releases the hold, so it is also the moment
  # the served page should change.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Give the Pages deployment a moment to propagate
        run: sleep 30

      # A release event is emitted before the dispatched Pages deployment has
      # necessarily replaced the previous bytes. Sleep alone was a race: the
      # rc6 release probe read rc5 and failed although the deploy then succeeded.
      # Wait for a successful deployment status carrying the Pages environment
      # URL for the released commit; a failed deployment fails this job.
      - name: Wait for the Pages deployment of the released commit
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
          echo "released commit: $sha" >> "$GITHUB_STEP_SUMMARY"
          for attempt in $(seq 1 60); do
            deployment="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${sha}&per_page=1" --jq '.[0].id // empty' 2>/dev/null || true)"
            if [ -n "$deployment" ]; then
              record="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment}/statuses" --jq '.[0] | [(.state // ""), (.environment_url // "")] | @tsv' 2>/dev/null || true)"
              state="${record%%$'\t'*}"
              url="${record#*$'\t'}"
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "deployed: $url" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::error::Pages deployment ${deployment} failed"
                exit 1
              fi
            fi
            echo "waiting for Pages deployment of ${sha} (attempt ${attempt}/60)"
            sleep 10
          done
          echo "::error::Timed out waiting for the Pages deployment of ${sha}"
          exit 1

      - name: Determine the version that should be served
        id: expected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hold="$(tr -d '[:space:]' < DEPLOY_HOLD)"
          status="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${hold}" --jq '.draft|tostring + " " + (.prerelease|tostring)' 2>/dev/null || true)"
          if [ "$status" = "false true" ]; then
            expected="$hold"
            reason="held release is published"
          else
            expected="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')"
            reason="held release is not published; compare with newest published release"
          fi
          if [ -z "$expected" ]; then
            echo "::error::No published release and no published hold release to probe"
            exit 1
          fi
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "Probing $expected ($reason)" >> "$GITHUB_STEP_SUMMARY"

      - name: Probe the published application
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.expected }}
        run: python tests/pages_smoke.py
