name: Dispatch main deploy after prerelease publication

on:
  release:
    types: [published]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-deploy:
    if: github.event.release.prerelease == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch the gated deploy workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main"}'
