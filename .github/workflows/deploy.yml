name: Deploy Flashcard

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "data/**"
      - "assets/**"
      - "scripts/validate_vocab.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: flashcard-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate vocabulary
        run: python scripts/validate_vocab.py

      # The repository also contains source PDFs and exam notes. Stage only the
      # static app so Pages does not upload unrelated archive material.
      - name: Stage static files
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html style.css app.js _site/
          cp data/vocabulary.json _site/data/
          if [ -d assets ]; then cp -R assets _site/assets; fi
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
