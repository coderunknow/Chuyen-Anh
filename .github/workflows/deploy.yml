name: Deploy Flashcard

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "Learned_Vocabulary_List.md"
      - "data/**"
      - "scripts/build_vocabulary.py"
      - "scripts/embed_vocabulary.py"
      - "scripts/learned_vocabulary.py"
      - "scripts/validate_vocab.py"
      - "scripts/exams/**"
      - "scripts/deploy_gate.py"
      - "De-chuyen-Anh-vao-10/**"
      - ".github/workflows/deploy.yml"
      - "DEPLOY_HOLD"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even while the release named in DEPLOY_HOLD is unpublished"
        required: false
        type: boolean
        default: false

concurrency:
  group: flashcard-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # The release named in DEPLOY_HOLD must be published before Pages deploys.
      # Tests below always run; only the publish steps are deferred.
      - name: Evaluate deploy hold
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_deploy == true }}
        run: python3 scripts/deploy_gate.py

      - name: Check vocabulary sources and embedded HTML
        run: |
          python scripts/build_vocabulary.py --check
          python scripts/validate_vocab.py
          python scripts/embed_vocabulary.py --check
          python scripts/exams/embed_archive.py --check

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      # Node is used only for dependency-free tests; production is a single HTML file.
      - name: Set up Node for app-logic tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static app logic and single-file tests
        run: node --test tests/static-app.test.js

      # Publish only the fully self-contained application file.
      - name: Stage standalone HTML
        if: steps.gate.outputs.deploy == 'true'
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          test "$(find _site -maxdepth 1 -type f | wc -l)" -eq 1

      # Pages must be enabled once in Settings → Pages with GitHub Actions.
      # Do not use enablement: true here: GITHUB_TOKEN cannot create a Pages site.
      - name: Configure Pages
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
