name: Deploy Flashcard

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "Learned_Vocabulary_List.md"
      - "data/**"
      - "scripts/build_vocabulary.py"
      - "scripts/embed_vocabulary.py"
      - "scripts/learned_vocabulary.py"
      - "scripts/validate_vocab.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: flashcard-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check vocabulary sources and embedded HTML
        run: |
          python scripts/build_vocabulary.py --check
          python scripts/validate_vocab.py
          python scripts/embed_vocabulary.py --check

      # Publish only the fully self-contained application file.
      - name: Stage standalone HTML
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          test "$(find _site -maxdepth 1 -type f | wc -l)" -eq 1

      # Pages must be enabled once in Settings → Pages with GitHub Actions.
      # Do not use enablement: true here: GITHUB_TOKEN cannot create a Pages site.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
