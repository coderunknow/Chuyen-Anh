name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to backfill (blank processes every current release)"
        required: false
        type: string
  push:
    tags:
      # dev/beta/rc prereleases; the script validates the exact tag pattern.
      - "v1.0.0-*"

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out workflow code and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Backfill releases or package pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: python3 scripts/release_artifacts.py
