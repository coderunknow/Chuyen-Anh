name: Validate exam archive
on:
  pull_request:
    paths:
      - 'De-chuyen-Anh-vao-10/**'
      - 'scripts/exams/**'
      - '.github/workflows/exam-*.yml'
  push:
    branches: [arena/01a0ba22-chuy-n-anh]
    paths:
      - 'De-chuyen-Anh-vao-10/**'
      - 'scripts/exams/**'
      - '.github/workflows/exam-*.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/exams/requirements.txt
      - run: python scripts/exams/test_archive.py
      - run: python scripts/exams/coverage.py
      - run: git diff --exit-code -- De-chuyen-Anh-vao-10/DO-PHU.md
