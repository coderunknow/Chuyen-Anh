name: Collect public exam sources
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exam-source-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/exams/requirements.txt
      - run: python scripts/exams/discover.py
      - run: python scripts/exams/review_sources.py
      - run: python scripts/exams/packages.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unreviewed-exam-transcriptions
          path: .source-review/
          include-hidden-files: true
          retention-days: 3
