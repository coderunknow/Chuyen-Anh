name: Collect public exam sources
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ba22-chuy-n-anh]
    paths:
      - scripts/exams/discover.py
      - .github/workflows/exam-sources.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/exams/requirements.txt
      - run: python scripts/exams/discover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-exam-sources
          path: .cache/exams/
          include-hidden-files: true
          retention-days: 3
