name: Collect public exam sources
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ba22-chuy-n-anh]
    paths:
      - scripts/exams/discover.py
      - .github/workflows/exam-sources.yml
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0ba22-chuy-n-anh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/exams/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: public-exam-sources
          path: .cache/exams/
          run-id: 35451398022
          github-token: ${{ github.token }}
      - run: python scripts/exams/discover.py
      - run: python scripts/exams/review_sources.py
      - name: Publish unreviewed transcriptions to session branch only
        if: github.ref == 'refs/heads/arena/01a0ba22-chuy-n-anh'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .source-review
          git commit -m 'data: stage unreviewed source transcriptions for verification'
          git push origin HEAD:arena/01a0ba22-chuy-n-anh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-exam-sources
          path: .cache/exams/
          include-hidden-files: true
          retention-days: 3
